# Nginx server block for WDS UI Test Platform
# Copy to /etc/nginx/sites-available/wds_ui_test and symlink into sites-enabled

server {
    listen 80;
    server_name your_domain_or_ip;

    client_max_body_size 20m;

    # Flask serves the built frontend (frontend/dist) directly,
    # so we simply reverse proxy everything to the backend.
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
